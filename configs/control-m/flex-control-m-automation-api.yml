### BMC Control-M Automation API
### https://docs.bmc.com/docs/automation-api/
---
integrations:
  - name: nri-flex
    interval: 60s
    config:
      name: controlMFlex
      global:
        base_url: https://<CONTROLM_HOST>:<CONTROLM_PORT>/automation-api/
        headers:
          Authorization: Bearer <CONTROLM_TOKEN>
        tls_config:
          insecure_skip_verify: false  # Do NOT set to true in production; configure certificate trust instead
      apis:
        - event_type: ControlMJobStatusSample
          ### https://docs.bmc.com/docs/automation-api/ - Run domain: get status of jobs
          url: run/jobs/status
          jq: .statuses[]

        - event_type: ControlMAgentSample
          ### https://docs.bmc.com/docs/automation-api/ - Config domain: get agent status for a server
          url: config/server/<CONTROLM_SERVER>/agents
          jq: .agents[]
